name: mathspin
description: "MathSpin – Çocuklar için eğlenceli matematik oyunu."
publish_to: 'none'
version: 1.1.0+3

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  google_fonts: ^6.2.1
  confetti: ^0.8.0
  audioplayers: ^6.1.0
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/clap.m4a
    - assets/sounds/wrong.m4a
    - assets/sounds/spin.m4a
    # Yazı tipleri uygulamaya gömülü: google_fonts bu klasördeki dosyaları
    # bulup kullanır, çalışma anında internetten indirmez. Dosya adları
    # Google Fonts API biçimindedir; DEĞİŞTİRME (eşleşme ada göre yapılır).
    - assets/google_fonts/

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#6CC4F7"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
